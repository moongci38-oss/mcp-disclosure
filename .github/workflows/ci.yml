name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 = package.json engines 하한, 22 = 개발 머신 버전.
        # 둘 다 도는지 봐야 "내 머신에서만 된다"를 잡는다.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # pretest 가 build 를 돌리므로 test 하나로 빌드까지 검증된다.
      # ⚠️ mcp-scanner(Python) 를 설치하지 않는다 — 테스트는 고정 fixture 기반이라
      #    스캐너 없이 전건 통과해야 한다. 여기서 깨지면 테스트가 환경에 기대고 있다는 뜻이다
      #    (2026-08-22 실제로 그런 테스트가 하나 있었다 — PATH 통제로 수정).
      - run: npm test

      # 배포 산출물 검증 — dist/ 가 .gitignore 라 npm 패키지에서 빠졌던 사고(2026-08-22)의 재발 방지.
      # npm test 안에도 같은 검사가 있지만, 여기서 실제 tarball 을 만들어 한 번 더 본다.
      - name: 패키지가 실제로 설치·실행되는가
        run: |
          set -euo pipefail
          npm pack --pack-destination /tmp
          WORK=$(mktemp -d); cd "$WORK"
          npm init -y >/dev/null
          npm install /tmp/agenttrust-*.tgz
          TARGET=$(mktemp -d)
          printf '{"mcpServers":{"demo":{"command":"node","args":["x.js"]}}}' > "$TARGET/.mcp.json"
          ./node_modules/.bin/agenttrust scan --path "$TARGET"
          test -f "$TARGET/agenttrust-findings.md"
          test -f "$TARGET/agenttrust-findings.json"
          echo "설치본 실행 OK"
